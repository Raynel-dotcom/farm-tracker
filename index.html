<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm &amp; Rental Tracker</title>
<style>
  :root{
    --navy:#1F3D2B;
    --navy-light:#2C5540;
    --cream:#F7F2E6;
    --white:#FFFFFF;
    --green:#2F8F5B;
    --green-bg:#E7F3EC;
    --gold:#C98A2C;
    --gold-bg:#FBF0DA;
    --coral:#A6472B;
    --coral-bg:#F5E6DF;
    --text-dark:#1A1A1A;
    --text-muted:#6E6355;
    --border:#E4DCC8;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--cream);color:var(--text-dark);}
  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{background:var(--navy);color:#fff;width:220px;flex-shrink:0;transition:width .2s ease;display:flex;flex-direction:column;padding:16px 0;}
  .sidebar.collapsed{width:64px;}
  .sidebar-top{display:flex;align-items:center;justify-content:space-between;padding:0 16px 20px;}
  .sidebar-title{font-family:Georgia,serif;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;}
  .sidebar.collapsed .sidebar-title{display:none;}
  .toggle-btn{background:var(--navy-light);border:none;color:#fff;width:34px;height:34px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .toggle-btn:hover{background:#2A3C6B;}
  .nav-item{display:flex;align-items:center;gap:14px;padding:14px 18px;cursor:pointer;color:#C9CFE0;font-size:15px;white-space:nowrap;overflow:hidden;border-left:3px solid transparent;}
  .nav-item:hover{background:var(--navy-light);color:#fff;}
  .nav-item.active{background:var(--navy-light);color:#fff;border-left:3px solid var(--gold);}
  .nav-icon{width:22px;height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .nav-icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}
  .sidebar.collapsed .nav-label{display:none;}

  /* Main */
  .main{flex:1;padding:28px 32px;max-width:980px;}
  .page-title{font-family:Georgia,serif;font-size:26px;margin:0 0 4px;}
  .page-sub{color:var(--text-muted);font-size:14px;margin:0 0 24px;}

  /* Cards */
  .card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:24px;}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:24px;}
  @media (max-width:640px){.grid3,.grid2{grid-template-columns:1fr;}}
  .stat-label{font-size:13px;color:var(--text-muted);margin:0 0 6px;}
  .stat-value{font-size:22px;font-weight:600;margin:0;}
  .hero{text-align:center;padding:26px 0;margin-bottom:24px;background:var(--white);border:1px solid var(--border);border-radius:12px;}
  .hero-label{font-size:14px;color:var(--text-muted);margin:0 0 6px;}
  .hero-value{font-family:Georgia,serif;font-size:44px;font-weight:600;margin:0;}

  /* Form */
  .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:16px;}
  @media (max-width:640px){.form-grid{grid-template-columns:1fr;}}
  label{font-size:13px;color:var(--text-muted);display:block;margin-bottom:6px;}
  input,select{width:100%;padding:10px 12px;font-size:15px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text-dark);}
  input:focus,select:focus{outline:2px solid var(--navy-light);border-color:var(--navy-light);}
  .btn{background:var(--navy);color:#fff;border:none;padding:12px 20px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:600;}
  .btn:hover{background:var(--navy-light);}
  .btn-danger{background:transparent;color:var(--coral);border:1px solid var(--coral);padding:6px 12px;font-size:13px;border-radius:6px;cursor:pointer;}
  .btn-danger:hover{background:var(--coral-bg);}
  .hint{font-size:12px;color:var(--text-muted);margin:-8px 0 16px;}

  /* Table */
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px;}
  th{text-align:left;padding:10px 12px;color:var(--text-muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--border);}
  td{padding:12px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .empty{text-align:center;color:var(--text-muted);padding:40px 20px;}
  .group-row td{background:#F3F1E9;font-weight:700;color:var(--navy);font-size:13px;}
  .pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;}
  .pill-green{background:var(--green-bg);color:var(--green);}
  .pill-gold{background:var(--gold-bg);color:var(--gold);}
  .pill-coral{background:var(--coral-bg);color:var(--coral);}

  /* Toolbar / export / view toggle */
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
  .btn-outline{background:#fff;color:var(--navy);border:1px solid var(--navy);padding:9px 16px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .btn-outline:hover{background:var(--cream);}
  .seg{display:inline-flex;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .seg button{border:none;background:transparent;padding:8px 16px;font-size:13px;cursor:pointer;color:var(--text-muted);font-weight:600;}
  .seg button.active{background:var(--navy);color:#fff;}
  .chart-card{margin-bottom:24px;}
</style>
</head>
<body>

        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>

<script>
/* ---------- state ---------- */
let rental = [];    // { id, property, month, amount, date, notes }
let matooke = [];   // { id, date, qty, price, notes }
let coffee = [];    // { id, date, qty, price, notes }
let expenses = [];  // { id, date, category, amount, notes }

let currentPage = 'overview';
let chartView = 'monthly';
let rentalView = 'all';
let matookeView = 'all';
let coffeeView = 'all';
let expensesView = 'all';
let overviewChart = null;

/* ---------- helpers ---------- */
function fmt(n){
  n = Math.round(n || 0);
  return 'UGX ' + n.toLocaleString('en-US');
}

function weekInfo(dateStr){
  const d = new Date(dateStr);
  if(isNaN(d)) return { sortKey: dateStr, label: dateStr };
  const onejan = new Date(d.getFullYear(),0,1);
  const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay() + 1) / 7);
  const padded = String(week).padStart(2,'0');
  return { sortKey: d.getFullYear() + '-W' + padded, label: d.getFullYear() + ' - Week ' + week };
}

function monthInfo(dateStr){
  const d = new Date(dateStr);
  if(isNaN(d)) return { sortKey: dateStr, label: dateStr };
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const padded = String(d.getMonth()+1).padStart(2,'0');
  return { sortKey: d.getFullYear() + '-' + padded, label: months[d.getMonth()] + ' ' + d.getFullYear() };
}

function groupRows(list, view, dateOf, renderRow, colspan){
  if(view === 'all') return list.map(renderRow).join('');
  const groups = {};
  list.forEach(item => {
    let sortKey, label;
    const raw = dateOf(item);
    if(view === 'weekly'){ const info = weekInfo(raw); sortKey = info.sortKey; label = info.label; }
    else if(view === 'monthly'){ const info = monthInfo(raw); sortKey = info.sortKey; label = info.label; }
    else { sortKey = raw; label = raw; }
    if(!groups[sortKey]) groups[sortKey] = { label, items: [] };
    groups[sortKey].items.push(item);
  });
  return Object.keys(groups).sort().reverse().map(key => {
    const group = groups[key];
    const rows = group.items.map(renderRow).join('');
    return `<tr class="group-row"><td colspan="${colspan}">${group.label}</td></tr>${rows}`;
  }).join('');
}

/* ---------- storage ---------- */
const supabaseUrl = 'https://ivuyqltnmdvejufjzddy.supabase.co';
const supabaseKey = 'sb_publishable_Lf5I7PLHTJ--IPhX2c35PQ_9mXY-3Aw';
const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

async function loadData(){
  try {
    const { data, error } = await supabaseClient.from('rental').select('*');
    if (error) throw error;
    rental = data || [];
  } catch(e) {
    console.error('Could not load rentals', e);
    rental = [];
  }
  try {
    const { data, error } = await supabaseClient.from('matooke').select('*');
    if (error) throw error;
    matooke = data || [];
  } catch(e) {
    console.error('Could not load matooke sales', e);
    matooke = [];
  }
  try {
    const { data, error } = await supabaseClient.from('coffee').select('*');
    if (error) throw error;
    coffee = data || [];
  } catch(e) {
    console.error('Could not load coffee sales', e);
    coffee = [];
  }
  try {
    const { data, error } = await supabaseClient.from('expenses').select('*');
    if (error) throw error;
    expenses = data || [];
  } catch(e) {
    console.error('Could not load expenses', e);
    expenses = [];
  }
  render();
}

async function addRental(e){
  try {
    const { data, error } = await supabaseClient.from('rental').insert({
      date: e.date,
      property: e.property,
      month: e.month,
      due: e.due,
      amount: e.amount
    }).select();
    if (error) throw error;
    if (data && data[0]) {
      rental.push(data[0]);
    }
  } catch(err) {
    console.error('Could not save rental payment', err);
  }
  render();
}
async function deleteRental(id){
  try {
    const { error } = await supabaseClient.from('rental').delete().eq('id', id);
    if (error) throw error;
    rental = rental.filter(r => r.id !== id);
  } catch(e) {
    console.error('Could not delete rental payment', e);
    alert('Could not remove this entry — please check your connection and try again.');
  }
  render();
}

  try {
    const { data, error } = await supabaseClient.from('matooke').insert({
      date: e.date,
      qty: e.qty,

    }).select();

      matooke.push(data[0]);

    console.error('Could not save matooke sale', err);

}
async function deleteMatooke(id){
  try {

    console.error('Could not delete matooke sale', e);

  try {

}
async function deleteCoffee(id){
  try {

      category: e.category,

    if (error) throw error;
    if (data && data[0]) {

    }
  } catch(err) {

}
async function deleteExpense(id){

/* ---------- nav ---------- */
document.getElementById('toggleBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
});
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    currentPage = item.dataset.page;
    render();
  });
});

function render(){
  const main = document.getElementById('main');
  if(currentPage === 'overview') return renderOverview(main);
  if(currentPage === 'rental') return renderRental(main);
  if(currentPage === 'matooke') return renderCrop(main, 'matooke');
  if(currentPage === 'coffee') return renderCrop(main, 'coffee');
  if(currentPage === 'expenses') return renderExpenses(main);
}

/* ---------- totals ---------- */
function totals(){
  const rentalTotal = rental.reduce((t,r) => t + r.amount, 0);
  const rentalOutstanding = rental.reduce((t,r) => t + (r.due - r.amount), 0);
  const matookeTotal = matooke.reduce((t,r) => t + r.qty * r.price, 0);
  const coffeeTotal = coffee.reduce((t,r) => t + r.qty * r.price, 0);
  const expensesTotal = expenses.reduce((t,r) => t + r.amount, 0);
  const income = rentalTotal + matookeTotal + coffeeTotal;
  const net = income - expensesTotal;
  return { rentalTotal, rentalOutstanding, matookeTotal, coffeeTotal, expensesTotal, income, net };
}

/* ---------- export ---------- */
function downloadBlob(content, filename, type){
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}
function toCSV(rows){
  if(rows.length === 0) return '';
  const headers = Object.keys(rows[0]);
  const lines = [headers.join(',')];
  rows.forEach(r => {
    lines.push(headers.map(h => {
      const v = r[h] === undefined || r[h] === null ? '' : String(r[h]);
      return v.includes(',') ? '"' + v.replace(/"/g,'""') + '"' : v;
    }).join(','));
  });
  return lines.join('\n');
}
function rentalRows(){ return rental.map(r => ({ Date: r.date, Property: r.property, Month: r.month, 'Amount due': r.due, 'Amount received': r.amount, Balance: r.due - r.amount })); }
function cropRows(kind){
  const list = kind === 'matooke' ? matooke : coffee;
  return list.map(r => ({ Date: r.date, Quantity: r.qty, 'Price per unit': r.price, Total: r.qty * r.price, Notes: r.notes || '' }));
}
function expenseRows(){ return expenses.map(r => ({ Date: r.date, Category: r.category, Amount: r.amount, Notes: r.notes || '' })); }

function exportCSV(kind){
  const rows = kind === 'rental' ? rentalRows() : kind === 'expenses' ? expenseRows() : cropRows(kind);
  if(rows.length === 0){ alert('Nothing to export yet.'); return; }
  downloadBlob(toCSV(rows), 'farm-' + kind + '.csv', 'text/csv');
}
function exportExcelAll(){
  if(rental.length===0 && matooke.length===0 && coffee.length===0 && expenses.length===0){ alert('Nothing to export yet.'); return; }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rentalRows()), 'Rental');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cropRows('matooke')), 'Matooke');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cropRows('coffee')), 'Coffee');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(expenseRows()), 'Expenses');
  XLSX.writeFile(wb, 'farm-rental-tracker.xlsx');
}

/* ---------- overview ---------- */
function renderOverview(main){
  const t = totals();
  const statusLabel = t.net > 0 ? 'Surplus' : t.net < 0 ? 'Deficit' : 'Balanced';
  const statusColor = t.net > 0 ? 'var(--green)' : t.net < 0 ? 'var(--coral)' : 'var(--gold)';
  main.innerHTML = `
    <div class="toolbar">
      <div>
        <p class="page-title">Overview</p>
        <p class="page-sub" style="margin:0;">Rental, Matooke and Coffee income against farm expenses.</p>
      </div>
      <button class="btn-outline" onclick="exportExcelAll()"><span>&#8595;</span> Export everything (Excel)</button>
    </div>
    <div class="hero">
      <p class="hero-label">${statusLabel}</p>
      <p class="hero-value" style="color:${statusColor};">${fmt(Math.abs(t.net))}</p>
    </div>
    <div class="grid3">
      <div class="card"><p class="stat-label">Rental income</p><p class="stat-value">${fmt(t.rentalTotal)}</p></div>
      <div class="card"><p class="stat-label">Matooke income</p><p class="stat-value">${fmt(t.matookeTotal)}</p></div>
      <div class="card"><p class="stat-label">Coffee income</p><p class="stat-value">${fmt(t.coffeeTotal)}</p></div>
    </div>
    <div class="grid2">
      <div class="card"><p class="stat-label">Total income</p><p class="stat-value" style="color:var(--green);">${fmt(t.income)}</p></div>
      <div class="card"><p class="stat-label">Total expenses</p><p class="stat-value" style="color:var(--coral);">${fmt(t.expensesTotal)}</p></div>
    </div>
    <div class="card chart-card">
      <div class="toolbar" style="margin-bottom:14px;">
        <p class="stat-label" style="margin:0;">Income vs expenses</p>
        <div class="seg">
          <button class="${chartView === 'daily' ? 'active' : ''}" onclick="setChartView('daily')">Daily</button>
          <button class="${chartView === 'weekly' ? 'active' : ''}" onclick="setChartView('weekly')">Weekly</button>
          <button class="${chartView === 'monthly' ? 'active' : ''}" onclick="setChartView('monthly')">Monthly</button>
        </div>
      </div>
      ${(rental.length+matooke.length+coffee.length+expenses.length) === 0 ? '<div class="empty">Add some entries to see the graph.</div>' : '<div style="position:relative;height:220px;"><canvas id="overviewChart"></canvas></div>'}
    </div>
  `;
  if((rental.length+matooke.length+coffee.length+expenses.length) > 0) drawOverviewChart();
}

function setChartView(view){ chartView = view; render(); }

function drawOverviewChart(){
  const groups = {};
  const bump = (dateStr, field, amount) => {
    if(!dateStr) return;
    let sortKey, label;
    if(chartView === 'monthly'){ const info = monthInfo(dateStr); sortKey = info.sortKey; label = info.label; }
    else if(chartView === 'weekly'){ const info = weekInfo(dateStr); sortKey = info.sortKey; label = info.label; }
    else { sortKey = dateStr; label = dateStr; }
    if(!groups[sortKey]) groups[sortKey] = { label, income: 0, expenses: 0 };
    groups[sortKey][field] += amount;
  };
  rental.forEach(r => bump(r.date, 'income', r.amount));
  matooke.forEach(r => bump(r.date, 'income', r.qty * r.price));
  coffee.forEach(r => bump(r.date, 'income', r.qty * r.price));
  expenses.forEach(r => bump(r.date, 'expenses', r.amount));

  const sortedKeys = Object.keys(groups).sort();
  const labels = sortedKeys.map(k => groups[k].label);
  const incomeData = sortedKeys.map(k => groups[k].income);
  const expenseData = sortedKeys.map(k => groups[k].expenses);

  const ctx = document.getElementById('overviewChart');
  if(!ctx) return;
  if(overviewChart) overviewChart.destroy();
  overviewChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Income', data: incomeData, backgroundColor: '#1F7A4D', borderRadius: 4, maxBarThickness: 22 },
        { label: 'Expenses', data: expenseData, backgroundColor: '#B5432F', borderRadius: 4, maxBarThickness: 22 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: true, position: 'top', labels: { color: '#6B6B63', font: { size: 12 }, boxWidth: 12 } } },
      scales: {
        y: { ticks: { color: '#6B6B63', font: { size: 11 } }, grid: { color: '#E4E0D4' } },
        x: { grid: { display: false }, ticks: { color: '#6B6B63', font: { size: 11 }, autoSkip: true, maxRotation: 45 } }
      }
    }
  });
}

/* ---------- rental ---------- */
function renderRental(main){
  main.innerHTML = `
    <div class="toolbar">
      <div>
        <p class="page-title">Rental</p>
        <p class="page-sub" style="margin:0;">Record rent received each month.</p>
      </div>
      <button class="btn-outline" onclick="exportCSV('rental')"><span>&#8595;</span> Export CSV</button>
    </div>
    <div class="card" style="margin-bottom:24px;">
      <div class="form-grid">
        <div><label for="r-date">Date received</label><input type="date" id="r-date"></div>
        <div><label for="r-property">Property / tenant</label><input type="text" id="r-property" placeholder="e.g. Main house - Mr. Okello"></div>
        <div><label for="r-month">Month covered</label><input type="month" id="r-month"></div>
        <div><label for="r-due">Amount due</label><input type="number" id="r-due" min="0" placeholder="0"></div>
        <div><label for="r-amount">Amount received</label><input type="number" id="r-amount" min="0" placeholder="0"></div>
      </div>
      <p class="hint">Leave "Amount received" lower than "Amount due" for a tenant who hasn't finished paying \u2014 the balance still owed is worked out for you.</p>
      <button class="btn" id="addRentalBtn">Add rental payment</button>
    </div>
    <div class="grid3">
      <div class="card"><p class="stat-label">Total amount due</p><p class="stat-value" id="r-stat-due">-</p></div>
      <div class="card"><p class="stat-label">Total received</p><p class="stat-value" style="color:var(--green);" id="r-stat-paid">-</p></div>
      <div class="card"><p class="stat-label">Outstanding balance</p><p class="stat-value" style="color:var(--coral);" id="r-stat-balance">-</p></div>
    </div>
    <div class="card">
      <div class="toolbar" style="margin-bottom:0;">
        <p class="stat-label" style="margin:0;">All rental payments</p>
        <div class="seg">
          <button class="${rentalView==='all'?'active':''}" onclick="setRentalView('all')">All</button>
          <button class="${rentalView==='monthly'?'active':''}" onclick="setRentalView('monthly')">Monthly</button>
        </div>
      </div>
      ${rental.length === 0 ? '<div class="empty">No rental payments recorded yet.</div>' : renderRentalTable()}
    </div>
  `;
  document.getElementById('addRentalBtn').addEventListener('click', () => {
    const date = document.getElementById('r-date').value || new Date().toISOString().slice(0,10);
    const property = document.getElementById('r-property').value.trim();
    const month = document.getElementById('r-month').value;
    const due = parseFloat(document.getElementById('r-due').value) || 0;
    const amount = parseFloat(document.getElementById('r-amount').value) || 0;
    if(!property || due <= 0){ alert('Please enter the property/tenant and the amount due.'); return; }
    addRental({ date, property, month, due, amount });
  });
  updateRentalStats();
}
function updateRentalStats(){
  const totalDue = rental.reduce((t,r) => t + r.due, 0);
  const totalPaid = rental.reduce((t,r) => t + r.amount, 0);
  const dueEl = document.getElementById('r-stat-due');
  const paidEl = document.getElementById('r-stat-paid');
  const balEl = document.getElementById('r-stat-balance');
  if(dueEl) dueEl.textContent = fmt(totalDue);
  if(paidEl) paidEl.textContent = fmt(totalPaid);
  if(balEl) balEl.textContent = fmt(totalDue - totalPaid);
}
function setRentalView(v){ rentalView = v; render(); }
async function markRentalPaidUp(id){
  const r = rental.find(x => x.id === id);
  if (!r) return;
  const previousAmount = r.amount;
  r.amount = r.due; // update locally right away so the screen responds
  render();
  try {
    const { error } = await supabaseClient.from('rental').update({ amount: r.due }).eq('id', id);
    if (error) throw error;
  } catch(e) {
    console.error('Could not mark rental as paid up', e);
    r.amount = previousAmount; // revert since it didn't actually save
    alert('Could not save this — please check your connection and try again.');
    render();
  }
}
function renderRentalTable(){
  const rowFn = r => {
    const balance = r.due - r.amount;
    return `<tr>
      <td>${r.date}</td><td>${r.property}</td><td>${r.month || '-'}</td>
      <td class="num">${fmt(r.due)}</td>
      <td class="num">${fmt(r.amount)}</td>
      <td class="num" style="color:${balance>0?'var(--coral)':'var(--green)'};">${balance>0?fmt(balance):'Paid up'}</td>
      <td>
        ${balance>0 ? `<button class="btn-outline" onclick="markRentalPaidUp('${r.id}')" style="margin-right:6px;">Paid up</button>` : ''}
        <button class="btn-danger" onclick="deleteRental('${r.id}')">Remove</button>
      </td>
    </tr>`;
  };
  const body = groupRows(rental.slice().reverse(), rentalView, r => r.date, rowFn, 7);
  return `<table><thead><tr><th>Date</th><th>Property</th><th>Month</th><th class="num">Amount Due</th><th class="num">Amount Received</th><th class="num">Balance</th><th></th></tr></thead><tbody>${body}</tbody></table>`;
}

/* ---------- matooke & coffee ---------- */
function renderCrop(main, kind){
  const list = kind === 'matooke' ? matooke : coffee;
  const view = kind === 'matooke' ? matookeView : coffeeView;
  const unitLabel = kind === 'matooke' ? 'bunch' : 'kg';
  const title = kind === 'matooke' ? 'Matooke' : 'Coffee';

  main.innerHTML = `
    <div class="toolbar">
      <div>
        <p class="page-title">${title}</p>
        <p class="page-sub" style="margin:0;">Record every sale as it happens.</p>
      </div>
      <button class="btn-outline" onclick="exportCSV('${kind}')"><span>&#8595;</span> Export CSV</button>
    </div>
    <div class="card" style="margin-bottom:24px;">
      <div class="form-grid">
        <div><label for="c-date">Date</label><input type="date" id="c-date"></div>
        <div><label for="c-qty">Quantity (${unitLabel}s)</label><input type="number" id="c-qty" min="0" placeholder="0"></div>
        <div><label for="c-price">Price per ${unitLabel}</label><input type="number" id="c-price" min="0" placeholder="0"></div>
        <div><label for="c-notes">Notes (optional)</label><input type="text" id="c-notes" placeholder="e.g. buyer name"></div>
      </div>
      <button class="btn" id="addCropBtn">Add sale</button>
    </div>
    <div class="card">
      <div class="toolbar" style="margin-bottom:0;">
        <p class="stat-label" style="margin:0;">All ${title.toLowerCase()} sales</p>
        <div class="seg">
          <button class="${view==='all'?'active':''}" onclick="setCropView('${kind}','all')">All</button>
          <button class="${view==='daily'?'active':''}" onclick="setCropView('${kind}','daily')">Daily</button>
          <button class="${view==='weekly'?'active':''}" onclick="setCropView('${kind}','weekly')">Weekly</button>
          <button class="${view==='monthly'?'active':''}" onclick="setCropView('${kind}','monthly')">Monthly</button>
        </div>
      </div>
      ${list.length === 0 ? '<div class="empty">No sales recorded yet.</div>' : renderCropTable(kind, view, unitLabel)}
    </div>
  `;
  document.getElementById('addCropBtn').addEventListener('click', () => {
    const date = document.getElementById('c-date').value || new Date().toISOString().slice(0,10);
    const qty = parseFloat(document.getElementById('c-qty').value) || 0;
    const price = parseFloat(document.getElementById('c-price').value) || 0;
    const notes = document.getElementById('c-notes').value.trim();
    if(qty <= 0){ alert('Enter a quantity above 0.'); return; }
    const entry = { id: Date.now().toString(), date, qty, price, notes };
    if(kind === 'matooke') addMatooke(entry); else addCoffee(entry);
  });
}
function setCropView(kind, v){ if(kind==='matooke') matookeView = v; else coffeeView = v; render(); }
function renderCropTable(kind, view, unitLabel){
  const list = kind === 'matooke' ? matooke : coffee;
  const deleteFn = kind === 'matooke' ? 'deleteMatooke' : 'deleteCoffee';
  const rowFn = r => `<tr>
    <td>${r.date}</td>
    <td class="num">${r.qty} ${unitLabel}${r.qty===1?'':'s'}</td>
    <td class="num">${fmt(r.price)}</td>
    <td class="num">${fmt(r.qty*r.price)}</td>
    <td>${r.notes || ''}</td>
    <td><button class="btn-danger" onclick="${deleteFn}('${r.id}')">Remove</button></td>
  </tr>`;
  const body = groupRows(list.slice().reverse(), view, r => r.date, rowFn, 6);
  return `<table><thead><tr><th>Date</th><th class="num">Qty</th><th class="num">Price/unit</th><th class="num">Total</th><th>Notes</th><th></th></tr></thead><tbody>${body}</tbody></table>`;
}
